<!DOCTYPE html>
<html>
<head>
    <title>Audio Test</title>
</head>
<body>
    <h1>Audio Test</h1>
    <button onclick="testAudio()">Play Test Audio</button>
    <p id="status"></p>
    
    <script>
        async function testAudio() {
            const status = document.getElementById('status');
            status.textContent = 'Loading...';
            
            try {
                const response = await fetch('https://valves-describes-terminals-differential.trycloudflare.com/voice/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: 'This is a test of the audio system' })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const blob = await response.blob();
                status.textContent = `Got ${blob.size} bytes of ${blob.type}`;
                
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                
                audio.onplay = () => status.textContent += ' - Playing!';
                audio.onerror = (e) => status.textContent += ` - Error: ${e.message}`;
                audio.onended = () => status.textContent += ' - Done!';
                
                await audio.play();
                
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
