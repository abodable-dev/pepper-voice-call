<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Pepper 🌶️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .emoji {
            text-align: center;
            font-size: 80px;
            margin: 20px 0;
        }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 500;
            font-size: 16px;
        }
        .status.idle { background: #f0f0f0; color: #666; }
        .status.connecting { background: #fff3cd; color: #856404; }
        .status.connected { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        button {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin: 10px 0;
        }
        button.start {
            background: #28a745;
            color: white;
        }
        button.start:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40,167,69,0.3);
        }
        button.end {
            background: #dc3545;
            color: white;
        }
        button.end:hover {
            background: #c82333;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #004085;
            text-align: center;
        }
        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 28px; }
            .emoji { font-size: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Call Pepper</h1>
        <div class="emoji">🌶️📞</div>
        
        <div id="status" class="status idle">
            Ready to start voice call
        </div>
        
        <button id="startBtn" class="start" onclick="startCall()">
            🎤 Start Voice Call
        </button>
        
        <button id="endBtn" class="end" onclick="endCall()" style="display:none;">
            ❌ End Call
        </button>
        
        <div class="info">
            📱 Works on any device with a microphone<br>
            🌐 No app installation needed
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let recognition;
        let isActive = false;

        function updateStatus(message, type = 'idle') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        async function startCall() {
            try {
                updateStatus('Requesting microphone access...', 'connecting');
                
                // Request microphone
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                updateStatus('🎙️ Connected! Speak to Pepper...', 'connected');
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('endBtn').style.display = 'block';
                isActive = true;
                
                // Try Web Speech API first (Chrome/Safari)
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    recognition = new SpeechRecognition();
                    recognition.continuous = true;
                    recognition.interimResults = false;
                    
                    recognition.onresult = async (event) => {
                        const transcript = event.results[event.results.length - 1][0].transcript;
                        updateStatus(`You said: "${transcript}"`, 'connected');
                        
                        // Send to Pepper
                        await sendMessage(transcript);
                    };
                    
                    recognition.onerror = (event) => {
                        console.error('Speech recognition error:', event.error);
                        updateStatus('Speech recognition error - trying audio recording...', 'error');
                        startAudioRecording(stream);
                    };
                    
                    recognition.start();
                    
                } else {
                    // Fallback: record audio
                    startAudioRecording(stream);
                }
                
            } catch (err) {
                updateStatus(`Error: ${err.message}`, 'error');
                console.error(err);
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('endBtn').style.display = 'none';
            }
        }

        function startAudioRecording(stream) {
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };
            
            mediaRecorder.onstop = async () => {
                if (!isActive) return;
                
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                audioChunks = [];
                
                updateStatus('Processing your message...', 'connecting');
                await sendAudio(audioBlob);
                
                // Restart recording
                if (isActive && mediaRecorder.state !== 'recording') {
                    mediaRecorder.start();
                }
            };
            
            // Record in 5-second chunks
            mediaRecorder.start();
            setInterval(() => {
                if (isActive && mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            }, 5000);
        }

        async function sendMessage(text) {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        sessionKey: 'voice-call-' + Date.now()
                    })
                });
                
                const result = await response.json();
                
                if (result.response) {
                    updateStatus(`Pepper: "${result.response}"`, 'connected');
                    
                    // Speak response (if supported)
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(result.response);
                        utterance.rate = 1.1;
                        utterance.pitch = 1.0;
                        window.speechSynthesis.speak(utterance);
                    }
                }
                
                setTimeout(() => {
                    if (isActive) {
                        updateStatus('🎙️ Listening...', 'connected');
                    }
                }, 2000);
                
            } catch (err) {
                console.error('Failed to send message:', err);
                updateStatus('Connection error - retrying...', 'error');
            }
        }

        async function sendAudio(blob) {
            // For now, just indicate we got audio
            updateStatus('Audio recorded - text me instead for now 😅', 'connecting');
            setTimeout(() => {
                if (isActive) {
                    updateStatus('🎙️ Listening...', 'connected');
                }
            }, 2000);
        }

        function endCall() {
            isActive = false;
            
            if (recognition) {
                recognition.stop();
            }
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            
            updateStatus('Call ended - refresh to start again', 'idle');
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('endBtn').style.display = 'none';
        }
    </script>
</body>
</html>
