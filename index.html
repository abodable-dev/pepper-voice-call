<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Pepper 🌶️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .emoji {
            text-align: center;
            font-size: 80px;
            margin: 20px 0;
        }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 500;
            font-size: 16px;
        }
        .status.idle { background: #f0f0f0; color: #666; }
        .status.connecting { background: #fff3cd; color: #856404; }
        .status.connected { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        button {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin: 10px 0;
        }
        button.start {
            background: #28a745;
            color: white;
        }
        button.start:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40,167,69,0.3);
        }
        button.end {
            background: #dc3545;
            color: white;
        }
        button.end:hover {
            background: #c82333;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .transcript {
            margin-top: 20px;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #007bff;
        }
        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s;
        }
        .message.user {
            background: #e3f2fd;
            text-align: right;
        }
        .message.assistant {
            background: #f3e5f5;
        }
        .message strong {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.7;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #004085;
            text-align: center;
        }
        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 28px; }
            .emoji { font-size: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Call Pepper</h1>
        <div class="emoji">🌶️📞</div>
        
        <div id="status" class="status idle">
            Ready to start voice call
        </div>
        
        <button id="startBtn" class="start" onclick="initCall()">
            🎤 Start Voice Call
        </button>
        
        <div id="callControls" style="display:none;">
            <button id="endBtn" class="end" onclick="endCall()">
                ❌ End Call
            </button>
        </div>
        
        <div id="transcript" class="transcript" style="display:none;">
            <div id="messages">
                <div style="text-align:center; color:#999; font-size:14px;">Conversation will appear here...</div>
            </div>
        </div>
        
        <div class="info">
            📱 Works best in Chrome/Safari<br>
            🌐 Powered by Claude Haiku 3.5 + ElevenLabs
        </div>
    </div>

    <script>
        let recognition;
        let isActive = false;
        let isRecognitionRunning = false; // Track recognition state
        let isProcessing = false; // Ignore transcripts while processing
        let conversationHistory = [];
        const BASE_URL = 'https://valves-describes-terminals-differential.trycloudflare.com';
        const API_URL = `${BASE_URL}/v1/chat/completions`;
        const TTS_URL = `${BASE_URL}/voice/tts`;
        const API_TOKEN = '0606e7e42d266711af55d7f720655c5ce242086b8f0ca51a';
        
        let currentAudio = null; // Persistent audio element
        let isAudioReady = false;
        let isRecording = false;
        let recordingChunks = [];

        function updateStatus(message, type = 'idle') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('messages');
            const transcriptDiv = document.getElementById('transcript');
            
            console.log('📝 Adding message:', role, content.substring(0, 50));
            console.log('📝 Messages div children count before:', messagesDiv.children.length);
            
            transcriptDiv.style.display = 'block';
            
            // Clear placeholder on first message
            if (messagesDiv.children.length === 1 && messagesDiv.children[0].style) {
                messagesDiv.innerHTML = '';
            }
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `<strong>${role === 'user' ? 'You' : 'Pepper'}</strong>${content}`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            console.log('📝 Messages div children count after:', messagesDiv.children.length);
            
            // Force transcript to stay visible
            setTimeout(() => {
                transcriptDiv.style.display = 'block';
                console.log('🔒 Transcript visibility enforced');
            }, 100);
        }

        async function initCall() {
            try {
                updateStatus('Requesting microphone access...', 'connecting');
                
                // Create persistent audio element from user gesture
                if (!currentAudio) {
                    currentAudio = new Audio();
                    // Play silent audio to unlock iOS
                    currentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                    try {
                        await currentAudio.play();
                        isAudioReady = true;
                        console.log('✅ Audio element ready');
                    } catch (e) {
                        console.log('⚠️ Audio unlock failed:', e);
                    }
                }
                
                // Check for speech recognition support
                if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                    updateStatus('Speech recognition not supported in this browser', 'error');
                    return;
                }
                
                // Request microphone
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                updateStatus('🎙️ Listening... just start talking!', 'connected');
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('callControls').style.display = 'block';
                document.getElementById('transcript').style.display = 'block'; // Show transcript from the start
                isActive = true;
                
                // Initialize conversation
                conversationHistory = [];
                const messagesDiv = document.getElementById('messages');
                const transcriptDiv = document.getElementById('transcript');
                messagesDiv.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">Your conversation will appear here...</div>';
                transcriptDiv.style.display = 'block';
                console.log('🎬 Call started - transcript area should be visible with placeholder');
                
                // Setup speech recognition
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'en-AU';
                
                recognition.onresult = async (event) => {
                    const transcript = event.results[event.results.length - 1][0].transcript.trim();
                    console.log('🎤 Recognition fired. Transcript:', transcript, 'isProcessing:', isProcessing);
                    
                    if (!transcript) {
                        console.log('⚠️ Empty transcript, ignoring');
                        return;
                    }
                    
                    if (isProcessing) {
                        console.log('⚠️ Already processing, ignoring:', transcript);
                        return;
                    }
                    
                    console.log('✅ Heard:', transcript);
                    isProcessing = true;
                    addMessage('user', transcript);
                    updateStatus('🤔 Pepper is thinking...', 'connecting');
                    
                    await sendMessage(transcript);
                };
                
                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    if (event.error === 'no-speech') {
                        return; // Ignore, just keep listening
                    }
                    if (event.error === 'aborted') {
                        return; // Expected when we pause for audio playback
                    }
                    if (event.error === 'audio-capture') {
                        console.log('Audio capture error - will retry');
                        return; // Safari issue, will restart in onend
                    }
                    updateStatus(`Speech error: ${event.error}`, 'error');
                };
                
                recognition.onstart = () => {
                    isRecognitionRunning = true;
                    console.log('Recognition started');
                };
                
                recognition.onend = () => {
                    isRecognitionRunning = false;
                    console.log('⚠️ Recognition ended unexpectedly, isActive:', isActive);
                    if (isActive) {
                        // Only restart if we didn't intentionally end the call
                        setTimeout(() => {
                            if (isActive && !isRecognitionRunning) {
                                try {
                                    console.log('Restarting recognition...');
                                    recognition.start();
                                } catch (e) {
                                    console.error('Recognition restart failed:', e);
                                    updateStatus(`Error: ${e.message}`, 'error');
                                }
                            }
                        }, 100);
                    }
                };
                
                recognition.start();
                
                // Debug health check - log state every 5 seconds
                setInterval(() => {
                    if (isActive) {
                        const messagesDiv = document.getElementById('messages');
                        const transcriptDiv = document.getElementById('transcript');
                        console.log('📊 Health check - isActive:', isActive, 'isProcessing:', isProcessing, 'isRecognitionRunning:', isRecognitionRunning);
                        console.log('📊 Messages count:', messagesDiv.children.length, 'Transcript visible:', transcriptDiv.style.display);
                        
                        // Force transcript to stay visible if we have messages
                        if (messagesDiv.children.length > 0 && transcriptDiv.style.display !== 'block') {
                            console.log('⚠️ Transcript was hidden! Forcing it back visible');
                            transcriptDiv.style.display = 'block';
                        }
                    }
                }, 5000);
                
            } catch (err) {
                updateStatus(`Error: ${err.message}`, 'error');
                console.error(err);
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('endBtn').style.display = 'none';
            }
        }

        async function sendMessage(userMessage) {
            try {
                // Add user message to history
                conversationHistory.push({
                    role: 'user',
                    content: userMessage
                });
                
                // Call Pepper's API with STREAMING
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_TOKEN}`
                    },
                    body: JSON.stringify({ 
                        model: 'anthropic/claude-3-5-haiku-20241022',
                        messages: conversationHistory,
                        stream: true,  // Enable streaming!
                        max_tokens: 512
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API returned ${response.status}`);
                }
                
                // Stream response and start speaking immediately
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                let buffer = '';
                
                updateStatus('🗣️ Pepper is speaking...', 'connected');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices?.[0]?.delta?.content;
                                
                                if (content) {
                                    fullText += content;
                                    buffer += content;
                                    
                                    // Play audio as soon as we have a complete sentence
                                    const sentenceEnd = /[.!?]\s/.exec(buffer);
                                    if (sentenceEnd) {
                                        const sentence = buffer.slice(0, sentenceEnd.index + 1).trim();
                                        buffer = buffer.slice(sentenceEnd.index + sentenceEnd[0].length);
                                        
                                        if (sentence) {
                                            playTTS(sentence);
                                        }
                                    }
                                }
                            } catch (e) {
                                // Ignore JSON parse errors
                            }
                        }
                    }
                }
                
                // Play any remaining text
                if (buffer.trim()) {
                    playTTS(buffer.trim());
                }
                
                // Save to history
                conversationHistory.push({
                    role: 'assistant',
                    content: fullText
                });
                
                // Display full message
                addMessage('assistant', fullText);
                
                // Done processing - ready for next input
                console.log('🔓 Setting isProcessing = false');
                isProcessing = false;
                updateStatus('🎙️ Listening... (ready for input)', 'connected');
                console.log('✅ Ready for next input. isProcessing:', isProcessing);
                
            } catch (err) {
                console.error('Failed to send message:', err);
                updateStatus(`Error: ${err.message}`, 'error');
                isProcessing = false;
                
                setTimeout(() => {
                    if (isActive) {
                        updateStatus('🎙️ Listening...', 'connected');
                    }
                }, 2000);
            }
        }

        async function playTTS(text) {
            try {
                console.log('🗣️ Fetching TTS for:', text.substring(0, 50));

                // Get TTS audio from backend
                const response = await fetch(TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    throw new Error(`TTS HTTP ${response.status}`);
                }

                const audioBlob = await response.blob();
                console.log('✅ Got audio blob:', audioBlob.size, 'bytes');
                
                // Reuse the persistent audio element (keeps user gesture chain)
                const audioUrl = URL.createObjectURL(audioBlob);
                
                if (!currentAudio) {
                    currentAudio = new Audio();
                }
                
                // Remove old listeners
                currentAudio.onended = null;
                currentAudio.onerror = null;
                
                // Set new source
                currentAudio.src = audioUrl;
                
                currentAudio.onended = () => {
                    console.log('✅ Audio chunk finished. isProcessing:', isProcessing);
                    URL.revokeObjectURL(audioUrl);
                    
                    // Show we're still alive while playing chunks
                    if (isProcessing) {
                        updateStatus('🗣️ Speaking...', 'connected');
                    }
                };
                
                currentAudio.onerror = (e) => {
                    console.error('❌ Audio error:', currentAudio.error);
                    URL.revokeObjectURL(audioUrl);
                };
                
                // Play on the same Audio element
                await currentAudio.play();
                console.log('▶️ Playing');
                
            } catch (error) {
                console.error('❌ TTS error:', error);
            }
        }

        function endCall() {
            isActive = false;
            isRecording = false;
            isRecognitionRunning = false;
            isProcessing = false;
            
            if (recognition) {
                recognition.stop();
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            updateStatus('Call ended', 'idle');
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('callControls').style.display = 'none';
        }
    </script>
</body>
</html>
