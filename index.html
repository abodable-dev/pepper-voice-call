<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Call Pepper 🌶️</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Pepper">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#050505">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #050505;
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }
        
        .container {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 96px 40px;
        }
        
        /* Header */
        .header {
            text-align: center;
        }
        .header-label {
            color: rgba(255,255,255,0.2);
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-bottom: 8px;
        }
        .header-status {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: -0.02em;
        }
        
        /* Orb */
        .orb-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 256px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .orb {
            position: relative;
            width: 200px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .orb-blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            filter: blur(20px);
        }
        .orb-blob-1 {
            width: 96px;
            height: 96px;
            background: #5ac8fa;
            opacity: 0.7;
            animation: pulse 3s ease-in-out infinite;
        }
        .orb-blob-2 {
            width: 112px;
            height: 112px;
            left: -24px;
            background: #5e5ce6;
            opacity: 0.8;
            animation: bounce 4s ease-in-out infinite;
            animation-delay: 0.2s;
        }
        .orb-blob-3 {
            width: 112px;
            height: 112px;
            right: -24px;
            background: #bf5af2;
            opacity: 0.8;
            animation: bounce 5s ease-in-out infinite;
            animation-delay: 0.8s;
        }
        .orb-blob-4 {
            width: 144px;
            height: 80px;
            background: #ff375f;
            opacity: 0.6;
            animation: pulse 4s ease-in-out infinite;
            animation-delay: 1.5s;
        }
        .orb-glow {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 150px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            background: radial-gradient(ellipse at center, #5ac8fa 0%, #5e5ce6 30%, #bf5af2 60%, #ff375f 100%);
            animation: pulse 2s ease-in-out infinite;
        }
        .orb.active .orb-blob {
            transform: scale(1.3);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .transcript {
            margin-top: 32px;
            font-size: 18px;
            font-weight: 600;
            font-style: italic;
            color: rgba(255,255,255,0.4);
            text-align: center;
            padding: 0 16px;
            max-width: 600px;
        }
        
        /* Bottom Controls */
        .controls {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 24px;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .control-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        .control-btn.side {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            color: rgba(255,255,255,0.6);
        }
        .control-btn.side:active {
            background: rgba(255,255,255,0.1);
        }
        .control-btn.main {
            width: 96px;
            height: 96px;
            background: #2563eb;
            border-radius: 36px;
            color: white;
            box-shadow: 0 0 40px rgba(37,99,235,0.4);
        }
        .control-btn.main.listening {
            background: #dc2626;
            box-shadow: 0 0 40px rgba(220,38,38,0.4);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .control-btn.main.thinking {
            background: #ca8a04;
            box-shadow: 0 0 40px rgba(202,138,4,0.4);
        }
        .control-btn.main.speaking {
            background: #16a34a;
            box-shadow: 0 0 40px rgba(22,163,74,0.4);
        }
        .control-label {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        .control-label.dim {
            color: rgba(255,255,255,0.3);
        }
        
        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-label">Voice Mode</div>
            <div class="header-status" id="status">Tap mic to start</div>
        </div>

        <!-- Orb & Transcript -->
        <div class="orb-container">
            <div class="orb-glow"></div>
            <div class="orb" id="orb">
                <div class="orb-blob orb-blob-1"></div>
                <div class="orb-blob orb-blob-2"></div>
                <div class="orb-blob orb-blob-3"></div>
                <div class="orb-blob orb-blob-4"></div>
            </div>
            <div class="transcript" id="transcript">Tap the mic to talk</div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-item">
                <button class="control-btn side">
                    <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                    </svg>
                </button>
                <span class="control-label dim">Nav</span>
            </div>
            <div class="control-item">
                <button class="control-btn main" id="micBtn">
                    <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <span class="control-label" id="micLabel">Voice</span>
            </div>
            <div class="control-item">
                <button class="control-btn side">
                    <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="10 8 16 12 10 16 10 8"></polygon>
                    </svg>
                </button>
                <span class="control-label dim">Music</span>
            </div>
        </div>
    </div>

    <script>
        // Config
        const BASE_URL = 'https://valves-describes-terminals-differential.trycloudflare.com';
        const API_URL = `${BASE_URL}/v1/chat/completions`;
        const TTS_URL = `${BASE_URL}/voice/tts`;
        const API_TOKEN = '0606e7e42d266711af55d7f720655c5ce242086b8f0ca51a';

        // State
        let recognition;
        let isActive = false;
        let isListening = false;
        let isSpeaking = false;
        let isProcessing = false;
        let conversationHistory = [];
        let currentAudio = null;
        let audioQueue = [];
        let isPlayingQueue = false;
        let silenceTimer = null;
        let partialTranscript = '';

        // DOM
        const micBtn = document.getElementById('micBtn');
        const micLabel = document.getElementById('micLabel');
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript');
        const orb = document.getElementById('orb');

        // Update status
        function setStatus(text) {
            statusEl.textContent = text;
        }

        // Update transcript
        function setTranscript(text) {
            transcriptEl.textContent = text;
        }

        // Initialize continuous recognition with VAD
        async function initRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Speech recognition not supported');
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-AU';

            recognition.onresult = (event) => {
                const result = event.results[event.results.length - 1];
                const transcript = result[0].transcript.trim();
                
                if (transcript) {
                    partialTranscript = transcript;
                    setTranscript(transcript);
                    
                    clearTimeout(silenceTimer);
                    
                    if (result.isFinal && !isProcessing) {
                        silenceTimer = setTimeout(() => {
                            if (partialTranscript && !isProcessing) {
                                sendTranscript(partialTranscript);
                            }
                        }, 1500);
                    }
                }
            };

            recognition.onerror = (e) => {
                console.error('Recognition error:', e.error);
            };

            recognition.onend = () => {
                if (isActive && !isProcessing) {
                    setTimeout(() => {
                        if (isActive) {
                            try {
                                recognition.start();
                            } catch (e) {}
                        }
                    }, 100);
                }
            };

            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if (!currentAudio) {
                    currentAudio = new Audio();
                    currentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                    try { await currentAudio.play(); } catch (e) {}
                }
                return true;
            } catch (err) {
                alert('Microphone access denied');
                return false;
            }
        }

        // Start listening
        async function startListening() {
            if (!recognition) {
                const ready = await initRecognition();
                if (!ready) return;
            }
            
            isActive = true;
            partialTranscript = '';
            micBtn.classList.add('listening');
            micLabel.textContent = 'Listening';
            setStatus('Listening...');
            orb.classList.add('active');
            
            try {
                recognition.start();
            } catch (e) {}
        }

        // Send transcript
        async function sendTranscript(transcript) {
            if (isProcessing) return;
            
            clearTimeout(silenceTimer);
            isProcessing = true;
            partialTranscript = '';
            
            micBtn.classList.remove('listening');
            micBtn.classList.add('thinking');
            setStatus('Thinking...');
            
            await sendMessage(transcript);
        }

        // Send message to API
        async function sendMessage(userMessage) {
            audioQueue = [];
            conversationHistory.push({ role: 'user', content: userMessage });

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_TOKEN}`
                    },
                    body: JSON.stringify({ 
                        model: 'anthropic/claude-3-5-haiku-20241022',
                        messages: conversationHistory,
                        stream: true,
                        max_tokens: 512
                    })
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                let buffer = '';

                micBtn.classList.remove('thinking');
                micBtn.classList.add('speaking');
                setStatus('Speaking...');
                isSpeaking = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices?.[0]?.delta?.content;

                                if (content) {
                                    fullText += content;
                                    buffer += content;

                                    const sentenceEnd = /[.!?]\s/.exec(buffer);
                                    if (sentenceEnd) {
                                        const sentence = buffer.slice(0, sentenceEnd.index + 1).trim();
                                        buffer = buffer.slice(sentenceEnd.index + sentenceEnd[0].length);
                                        if (sentence) playTTS(sentence);
                                    }
                                }
                            } catch (e) {}
                        }
                    }
                }

                if (buffer.trim()) playTTS(buffer.trim());

                conversationHistory.push({ role: 'assistant', content: fullText });
                setTranscript(fullText);

                // Wait for audio to finish
                const checkDone = () => {
                    if (audioQueue.length === 0 && !isPlayingQueue) {
                        isProcessing = false;
                        isSpeaking = false;
                        
                        micBtn.classList.remove('speaking', 'thinking');
                        micBtn.classList.add('listening');
                        setStatus('Listening...');
                        setTranscript('Listening...');
                    } else {
                        setTimeout(checkDone, 500);
                    }
                };
                setTimeout(checkDone, 500);

            } catch (err) {
                console.error('Message error:', err);
                setStatus('Error');
                isProcessing = false;
            }
        }

        // Play TTS
        async function playTTS(text) {
            try {
                const response = await fetch(TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) throw new Error(`TTS error`);

                const audioBlob = await response.blob();
                audioQueue.push(audioBlob);
                
                if (!isPlayingQueue) playNextInQueue();
            } catch (err) {
                console.error('TTS error:', err);
            }
        }
        
        // Play next audio chunk
        async function playNextInQueue() {
            if (audioQueue.length === 0) {
                isPlayingQueue = false;
                return;
            }
            
            isPlayingQueue = true;
            const audioBlob = audioQueue.shift();
            const audioUrl = URL.createObjectURL(audioBlob);
            
            if (!currentAudio) currentAudio = new Audio();
            
            currentAudio.onended = () => {
                URL.revokeObjectURL(audioUrl);
                playNextInQueue();
            };
            
            currentAudio.onerror = () => {
                URL.revokeObjectURL(audioUrl);
                playNextInQueue();
            };
            
            currentAudio.src = audioUrl;
            await currentAudio.play();
        }

        // Interrupt
        function interrupt() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            audioQueue = [];
            isPlayingQueue = false;
            isSpeaking = false;
            isProcessing = false;
            partialTranscript = '';
            clearTimeout(silenceTimer);
            
            micBtn.classList.remove('speaking', 'thinking');
            micBtn.classList.add('listening');
            setStatus('Listening...');
            setTranscript('Listening...');
            
            if (recognition && isActive) {
                try { recognition.start(); } catch (e) {}
            }
        }

        // Mic button click
        micBtn.addEventListener('click', () => {
            if (!isActive) {
                startListening();
            } else if (isSpeaking || isProcessing) {
                interrupt();
            }
        });

        // Tap anywhere to interrupt
        document.addEventListener('click', (e) => {
            if (e.target === micBtn || e.target.closest('.control-btn')) return;
            if ((isSpeaking || isProcessing) && isActive) {
                interrupt();
            }
        });

        // Register service worker
        window.addEventListener('load', () => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.log('SW failed:', err));
            }
        });
    </script>
</body>
</html>
