<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Pepper 🌶️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .emoji {
            text-align: center;
            font-size: 80px;
            margin: 20px 0;
        }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 500;
            font-size: 16px;
        }
        .status.idle { background: #f0f0f0; color: #666; }
        .status.connecting { background: #fff3cd; color: #856404; }
        .status.connected { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        button {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin: 10px 0;
        }
        button.start {
            background: #28a745;
            color: white;
        }
        button.start:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40,167,69,0.3);
        }
        button.end {
            background: #dc3545;
            color: white;
        }
        button.end:hover {
            background: #c82333;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .transcript {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s;
        }
        .message.user {
            background: #e3f2fd;
            text-align: right;
        }
        .message.assistant {
            background: #f3e5f5;
        }
        .message strong {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.7;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #004085;
            text-align: center;
        }
        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 28px; }
            .emoji { font-size: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Call Pepper</h1>
        <div class="emoji">🌶️📞</div>
        
        <div id="status" class="status idle">
            Ready to start voice call
        </div>
        
        <button id="startBtn" class="start" onclick="startCall()">
            🎤 Start Voice Call
        </button>
        
        <button id="endBtn" class="end" onclick="endCall()" style="display:none;">
            ❌ End Call
        </button>
        
        <div id="transcript" class="transcript" style="display:none;">
            <div id="messages"></div>
        </div>
        
        <div class="info">
            📱 Works best in Chrome/Safari<br>
            🌐 Powered by Claude Sonnet 3.5 + ElevenLabs
        </div>
    </div>

    <script>
        let recognition;
        let isActive = false;
        let conversationHistory = [];
        const BASE_URL = 'https://valves-describes-terminals-differential.trycloudflare.com';
        const API_URL = `${BASE_URL}/v1/chat/completions`;
        const TTS_URL = `${BASE_URL}/voice/tts`;
        const API_TOKEN = '0606e7e42d266711af55d7f720655c5ce242086b8f0ca51a';
        
        let currentAudio = null; // Track playing audio
        let audioContext = null; // iOS audio unlock
        let audioQueue = []; // Queue for iOS
        let isAudioUnlocked = false;

        // Unlock audio on first user interaction
        function unlockAudio() {
            if (isAudioUnlocked) return;
            
            const audio = new Audio();
            audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
            audio.play().then(() => {
                console.log('✅ Audio unlocked for iOS');
                isAudioUnlocked = true;
            }).catch(e => {
                console.log('⚠️ Audio unlock failed:', e);
            });
        }

        function updateStatus(message, type = 'idle') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('messages');
            const transcriptDiv = document.getElementById('transcript');
            transcriptDiv.style.display = 'block';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `<strong>${role === 'user' ? 'You' : 'Pepper'}</strong>${content}`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function startCall() {
            try {
                // Unlock audio first
                unlockAudio();
                
                updateStatus('Requesting microphone access...', 'connecting');
                
                // Check for speech recognition support
                if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                    updateStatus('Speech recognition not supported in this browser', 'error');
                    return;
                }
                
                // Request microphone
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                updateStatus('🎙️ Connected! Speak to Pepper...', 'connected');
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('endBtn').style.display = 'block';
                isActive = true;
                
                // Initialize conversation
                conversationHistory = [];
                document.getElementById('messages').innerHTML = '';
                
                // Setup speech recognition
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'en-AU';
                
                recognition.onresult = async (event) => {
                    const transcript = event.results[event.results.length - 1][0].transcript.trim();
                    if (!transcript) return;
                    
                    console.log('Heard:', transcript);
                    addMessage('user', transcript);
                    updateStatus('🤔 Pepper is thinking...', 'connecting');
                    
                    await sendMessage(transcript);
                };
                
                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    if (event.error === 'no-speech') {
                        return; // Ignore, just keep listening
                    }
                    updateStatus(`Speech error: ${event.error}`, 'error');
                };
                
                recognition.onend = () => {
                    if (isActive) {
                        try {
                            recognition.start();
                        } catch (e) {
                            console.log('Recognition restart prevented:', e);
                        }
                    }
                };
                
                recognition.start();
                
            } catch (err) {
                updateStatus(`Error: ${err.message}`, 'error');
                console.error(err);
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('endBtn').style.display = 'none';
            }
        }

        async function sendMessage(userMessage) {
            try {
                // Add user message to history
                conversationHistory.push({
                    role: 'user',
                    content: userMessage
                });
                
                // Call Pepper's API
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_TOKEN}`
                    },
                    body: JSON.stringify({ 
                        model: 'anthropic/claude-sonnet-3.5-20241022',
                        messages: conversationHistory,
                        stream: false,
                        max_tokens: 1024
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error:', errorText);
                    throw new Error(`API returned ${response.status}`);
                }
                
                const result = await response.json();
                console.log('API Response:', result);
                
                const assistantMessage = result.choices?.[0]?.message;
                
                if (!assistantMessage) {
                    throw new Error('No message in response');
                }
                
                // Add full assistant message to history
                conversationHistory.push(assistantMessage);
                
                // Extract text content
                let textContent = '';
                if (typeof assistantMessage.content === 'string') {
                    textContent = assistantMessage.content;
                } else if (Array.isArray(assistantMessage.content)) {
                    const textBlocks = assistantMessage.content.filter(block => block.type === 'text');
                    textContent = textBlocks.map(block => block.text).join(' ');
                }
                
                if (textContent) {
                    addMessage('assistant', textContent);
                    updateStatus('🗣️ Pepper is speaking...', 'connected');
                    
                    // Play ElevenLabs TTS
                    await playTTS(textContent);
                } else {
                    if (isActive) {
                        updateStatus('🎙️ Listening...', 'connected');
                    }
                }
                
            } catch (err) {
                console.error('Failed to send message:', err);
                updateStatus(`Error: ${err.message}`, 'error');
                addMessage('assistant', `Sorry, I had an error: ${err.message}`);
                
                setTimeout(() => {
                    if (isActive) {
                        updateStatus('🎙️ Listening...', 'connected');
                    }
                }, 2000);
            }
        }

        async function playTTS(text, retryCount = 0) {
            try {
                // Stop any currently playing audio
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }

                // Get TTS audio from backend
                const response = await fetch(TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text }),
                    mode: 'cors'
                });

                if (!response.ok) {
                    throw new Error(`TTS failed: ${response.status}`);
                }

                // Check if we got HTML (ngrok warning page) instead of audio
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('text/html')) {
                    throw new Error('Got HTML instead of audio (ngrok warning?)');
                }

                // Convert response to blob and create audio URL
                const audioBlob = await response.blob();
                
                // Verify we got audio
                if (audioBlob.size < 1000) {
                    throw new Error('Audio blob too small');
                }
                
                const audioUrl = URL.createObjectURL(audioBlob);
                
                currentAudio = new Audio(audioUrl);
                currentAudio.preload = 'auto';
                
                currentAudio.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    currentAudio = null;
                    if (isActive) {
                        updateStatus('🎙️ Listening...', 'connected');
                    }
                };
                
                currentAudio.onerror = (e) => {
                    console.error('Audio playback error:', e);
                    URL.revokeObjectURL(audioUrl);
                    if (retryCount < 2) {
                        console.log('Retrying TTS...');
                        setTimeout(() => playTTS(text, retryCount + 1), 1000);
                    } else {
                        if (isActive) {
                            updateStatus('🎙️ Listening... (audio failed)', 'connected');
                        }
                    }
                };
                
                // Play with better error handling
                const playPromise = currentAudio.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.error('❌ Audio play error:', error.name, error.message);
                        
                        // Log to user
                        if (error.name === 'NotAllowedError') {
                            addMessage('assistant', '⚠️ Audio blocked - tap screen to enable');
                        } else if (error.name === 'NotSupportedError') {
                            addMessage('assistant', '⚠️ Audio format not supported');
                        } else {
                            addMessage('assistant', `⚠️ Audio error: ${error.name}`);
                        }
                        
                        if (isActive) {
                            updateStatus('🎙️ Listening... (audio failed)', 'connected');
                        }
                    });
                }
                
            } catch (error) {
                console.error('TTS error:', error);
                
                // Retry once if first attempt fails
                if (retryCount < 2) {
                    console.log('Retrying TTS after error...');
                    setTimeout(() => playTTS(text, retryCount + 1), 1000);
                } else {
                    addMessage('assistant', '(Audio failed - check console)');
                    if (isActive) {
                        updateStatus('🎙️ Listening... (audio error)', 'connected');
                    }
                }
            }
        }

        function endCall() {
            isActive = false;
            
            if (recognition) {
                recognition.stop();
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            updateStatus('Call ended', 'idle');
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('endBtn').style.display = 'none';
        }
    </script>
</body>
</html>
